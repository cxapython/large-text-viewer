[package]
name = "large-text-viewer"
version = "0.1.1"
edition = "2021"
description = "A high-performance viewer for large text files"
license = "MIT"
repository = "https://github.com/acejarvis/large-text-viewer"
keywords = ["gui", "text-viewer", "large-file"]
categories = ["gui", "visualization"]

[workspace]
members = ["crates/large-text-core"]

[dependencies]
eframe = "0.29"
egui = "0.29"
notify = "6.1"
rfd = "0.15"
anyhow = "1.0"
encoding_rs = "0.8"
regex = "1.10"
large-text-core = { path = "crates/large-text-core", version = "0.1.1" }

# Python 插件支持
pyo3 = { version = "0.22", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
python-plugins = ["pyo3"]

[build-dependencies]
pyo3-build-config = { version = "0.22", optional = true }

[package.metadata.pyo3]
# 使用系统 Python
python = "/usr/bin/python3"
